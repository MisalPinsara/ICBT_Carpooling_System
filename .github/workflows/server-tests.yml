name: Sprint 1 Automated Tests

on:
  push:
    branches:
      - main
      - dev
      - "dev-*"
  pull_request:
    branches:
      - main
      - dev
      - "dev-*"

jobs:
  server-tests:
    name: Server unit and API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run automated Jest tests
        run: npm test